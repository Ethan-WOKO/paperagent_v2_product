spring:
  application:
    name: yanban-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: ${YANBAN_PROJECT_MAX_FILE_SIZE:20MB}
      max-request-size: ${YANBAN_PROJECT_MAX_REQUEST_SIZE:256MB}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] traceId=%X{traceId:-} %logger{36} : %msg%n"

yanban:
  agent:
    v2:
      workspace:
        root: ${YANBAN_AGENT_V2_WORKSPACE_ROOT:data/agent-v2-workspaces}
    reactplan:
      enabled: ${YANBAN_AGENT_REACTPLAN_ENABLED:false}
      engine-origin: ${YANBAN_AGENT_REACTPLAN_ENGINE_ORIGIN:http://127.0.0.1:8092}
      engine-service-token: ${YANBAN_AGENT_REACTPLAN_ENGINE_SERVICE_TOKEN:}
      default-provider: ${YANBAN_AGENT_REACTPLAN_DEFAULT_PROVIDER:deepseek}
      default-model: ${YANBAN_AGENT_REACTPLAN_DEFAULT_MODEL:deepseek-chat}
      max-concurrent-tasks: ${YANBAN_AGENT_MAX_CONCURRENT_TASKS:20}
      max-concurrent-tasks-per-user: ${YANBAN_AGENT_MAX_CONCURRENT_TASKS_PER_USER:3}
      max-queued-tasks-per-user: ${YANBAN_AGENT_MAX_QUEUED_TASKS_PER_USER:10}
      task-lease-seconds: ${YANBAN_AGENT_TASK_LEASE_SECONDS:30}
    engine:
      gateway:
        enabled: ${YANBAN_AGENT_ENGINE_GATEWAY_ENABLED:false}
        task-grant-secret: ${YANBAN_AGENT_ENGINE_GATEWAY_TASK_GRANT_SECRET:}
        task-grant-ttl: ${YANBAN_AGENT_ENGINE_GATEWAY_TASK_GRANT_TTL:10m}
        workspace-root: ${YANBAN_AGENT_ENGINE_GATEWAY_WORKSPACE_ROOT:data/agent-engine-workspaces}
        max-read-bytes: ${YANBAN_AGENT_ENGINE_GATEWAY_MAX_READ_BYTES:10485760}
  sandbox:
    enabled: ${YANBAN_SANDBOX_ENABLED:false}
    required-at-startup: ${YANBAN_SANDBOX_REQUIRED_AT_STARTUP:false}
    provider: ${YANBAN_SANDBOX_PROVIDER:e2b}
    broker-url: ${YANBAN_SANDBOX_BROKER_URL:http://127.0.0.1:8091}
    broker-token: ${YANBAN_SANDBOX_BROKER_TOKEN:}
    max-concurrent-runs: ${YANBAN_SANDBOX_MAX_CONCURRENT_RUNS:18}
    cpus: ${YANBAN_SANDBOX_CPUS:2}
    memory-limit: ${YANBAN_SANDBOX_MEMORY_LIMIT:4GB}
    execution-timeout: ${YANBAN_SANDBOX_EXECUTION_TIMEOUT:15m}
    max-output-size: ${YANBAN_SANDBOX_MAX_OUTPUT_SIZE:20MB}
    network-enabled: ${YANBAN_SANDBOX_NETWORK_ENABLED:false}
  project:
    managed-storage-root: ${YANBAN_PROJECT_STORAGE_ROOT:data/project-storage}
    minio-object-prefix: ${YANBAN_PROJECT_MINIO_PREFIX:projects}
  jwt:
    secret: ${JWT_SECRET:dev_only_change_me_please_32_chars_minimum}
    access-token-ttl: 1h
    refresh-token-ttl: 7d
  invite:
    enabled: ${INVITE_CODE_ENABLED:true}
    codes: ${INVITE_CODES:}
    max-uses: ${INVITE_CODE_MAX_USES:5}
  admin:
    username: ${YANBAN_ADMIN_USERNAME:}
    password: ${YANBAN_ADMIN_PASSWORD:}
  demo:
    enabled: ${DEMO_ENABLED:false}
    seed-on-startup: ${DEMO_SEED_ON_STARTUP:true}
    username: ${DEMO_USERNAME:demo}
    reset-cron: "${DEMO_RESET_CRON:0 30 3 * * *}"
    canonical-url: ${DEMO_CANONICAL_URL:http://yanban.online:18080/demo}
    max-upload-bytes: ${DEMO_MAX_UPLOAD_BYTES:3145728}
    max-uploads-per-reset: ${DEMO_MAX_UPLOADS_PER_RESET:5}
    max-chat-messages-per-hour: ${DEMO_MAX_CHAT_MESSAGES_PER_HOUR:60}
    max-paper-tasks-per-reset: ${DEMO_MAX_PAPER_TASKS_PER_RESET:2}
  observability:
    default-window-minutes: 60
    plan-failure-rate-warning: 0.10
    plan-failure-rate-critical: 0.25
    running-plan-age-warning-seconds: 180
    running-plan-age-critical-seconds: 600
    plan-p95-warning-ms: 120000
    plan-p95-critical-ms: 300000
    guardrail-event-warning: 5
    guardrail-event-critical: 20
