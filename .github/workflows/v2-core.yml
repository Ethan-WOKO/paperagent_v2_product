name: V2 core

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu JDK 17
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Maven version
        run: mvn --version

      - name: Reject V2 to Yanban dependencies
        shell: bash
        run: |
          if git grep -n -I -E 'com\.yanban' -- agent-v2; then
            echo "::error::V2 core must not depend on com.yanban"
            exit 1
          fi

      - name: Test V2 core
        run: mvn -f agent-v2/pom.xml test

      - name: Test product TaskFrame adapter
        run: mvn -pl yanban-agent-v2-adapter -am test

      - name: Test owned Agent turn lookup
        run: mvn -pl yanban-core -Dtest=AgentRepositoryTest test

      - name: Test Agent turn product context resolver
        run: mvn -pl yanban-api -am -Dtest=AgentTurnProductContextResolverTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Test V2 Plan bootstrap persistence adapter
        run: mvn -pl yanban-api -am -Dtest=ProductPlanBootstrapCodecTest,ProductPlanBootstrapRepositoryAdapterTest,V2PlanBootstrapMigrationTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Test authenticated V2 Plan bootstrap composition
        run: mvn -pl yanban-agent-v2-adapter,yanban-api -am -Dtest=ProductPersistentPlanBootstrapRequestAdapterTest,AuthenticatedAgentTurnPlanBootstrapComposerTest,AuthenticatedAgentTurnPlanBootstrapCompositionTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Test V2 Plan lease persistence adapter
        run: mvn -pl yanban-api -am -Dtest=ProductLeaseRepositoryAdapterTest,ProductLeaseRepositoryConcurrencyTest,V2PlanLeaseMigrationTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Test V2 execution start persistence adapter
        run: mvn -pl yanban-api -am -Dtest=ProductExecutionStartCodecTest,ProductExecutionStartRepositoryAdapterTest,ProductExecutionStartRepositoryConcurrencyTest,V2ExecutionStartMigrationTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Test authenticated V2 fresh execution start composition
        run: mvn -pl yanban-api -am -Dtest=AuthenticatedAgentTurnFreshExecutionStartComposerTest,AuthenticatedAgentTurnFreshExecutionStartCompositionTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Test V2 execution start recovery inspection adapter
        run: mvn -pl yanban-api -am -Dtest=ProductExecutionStartRecoveryRepositoryAdapterTest,ProductExecutionStartRecoveryRepositoryConcurrencyTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Test authenticated V2 execution start recovery composition
        run: mvn -pl yanban-api -am -Dtest=AuthenticatedAgentTurnExecutionStartRecoveryComposerTest,AuthenticatedAgentTurnExecutionStartRecoveryCompositionTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Test V2 Plan execution context persistence adapter
        run: mvn -pl yanban-api -am -Dtest=ProductPlanExecutionContextCodecTest,ProductPlanExecutionContextRepositoryAdapterTest,ProductPlanExecutionContextRepositoryConcurrencyTest,V2PlanExecutionContextMigrationTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Test authenticated product Project version source adapter
        run: mvn -pl yanban-api -am -Dtest=AuthenticatedAgentTurnProjectVersionSourceFactoryTest,ProductProjectVersionSourceTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Test authenticated V2 Plan execution context composition
        run: mvn -pl yanban-agent-v2-adapter,yanban-api -am -Dtest=ProductWorkspaceIdDerivationTest,AuthenticatedAgentTurnPlanExecutionContextComposerTest,AuthenticatedAgentTurnPlanExecutionContextCompositionTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Test V2 first-Step activation persistence adapter
        run: mvn -pl yanban-api -am -Dtest=ProductStepActivationCodecTest,ProductStepActivationRepositoryAdapterTest,ProductStepActivationRepositoryConcurrencyTest,V2StepActivationMigrationTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Test authenticated V2 first-Step activation composition
        run: mvn -pl yanban-api -am -Dtest=AuthenticatedAgentTurnStepActivationComposerTest,AuthenticatedAgentTurnStepActivationCompositionTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Test V2 active-Step recovery inspection
        run: mvn -pl yanban-api -am -Dtest=ProductStepRecoveryRepositoryAdapterTest,ProductStepRecoveryRepositoryConcurrencyTest -Dsurefire.failIfNoSpecifiedTests=false test
